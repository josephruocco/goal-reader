<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Goal Reader</title>
    <script type="module" crossorigin src="/viewer.js"></script>
    <link rel="stylesheet" crossorigin href="/viewer.css">
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="meta">
          <div class="title">Goal Reader</div>
          <div id="fileMeta" class="fileMeta">Open a PDF…</div>
        </div>

        <div class="controls">
          <div class="control">
            <label for="fileInput">Open local PDF</label>
            <input id="fileInput" type="file" accept="application/pdf" />
          </div>

          <div class="control">
            <label for="startPage">Start</label>
            <input id="startPage" type="number" min="1" value="1" />
          </div>

          <div class="control">
            <label for="goalPages">Goal pages</label>
            <input id="goalPages" type="number" min="1" value="15" />
          </div>

          <div class="control">
            <label for="skipPages">Skip pages</label>
            <input
              id="skipPages"
              type="text"
              placeholder="e.g. 1-4, 10, 23-30"
              style="width: 220px"
            />
          </div>

          <div class="control">
            <label for="goalMinutes">Goal minutes</label>
            <input id="goalMinutes" type="number" min="1" value="45" />
          </div>

          <div class="control">
            <label for="timerMode">Timer</label>
            <select id="timerMode">
              <option value="countdown">Countdown</option>
              <option value="countup">Countup</option>
            </select>
          </div>

          <button id="applyGoal" class="btn">Apply</button>

          <div class="timerBox">
            <div id="timerDisplay" class="timerDisplay">00:00:00</div>
            <button id="timerToggle" class="btn">Start</button>
            <button id="timerReset" class="btn">Reset</button>
          </div>
        </div>
      </header>

      <main class="main">
        <aside class="sidebar">
          <div class="stat">
            <div class="k">Current page</div>
            <div class="v" id="currentPage">–</div>
          </div>
          <div class="stat">
            <div class="k">Total pages</div>
            <div class="v" id="totalPages">–</div>
          </div>
          <div class="stat">
            <div class="k">Target end page</div>
            <div class="v" id="endPage">–</div>
          </div>
          <div class="stat">
            <div class="k">Remaining pages</div>
            <div class="v" id="remainingPages">–</div>
          </div>
          <div class="stat">
            <div class="k">Time remaining</div>
            <div class="v" id="remainingTime">–</div>
          </div>
          <div class="stat">
            <div class="k">Pace needed</div>
            <div class="v" id="paceNeeded">–</div>
          </div>

          <div class="progressWrap">
            <div id="progressText" class="progressText">Open a PDF (URL or local file).</div>
            <div class="bar">
              <div id="progressBarInner" class="barInner" style="width:0%"></div>
            </div>
          </div>
        </aside>

        <section id="viewer" class="viewer">
          <div id="canvasWrap" class="canvasWrap"></div>
        </section>
      </main>
    </div>

  </body>
</html>
