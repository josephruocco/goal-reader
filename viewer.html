<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self'; object-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Goal Reader</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <div id="topbar">
      <div id="left">
        <div id="title">Goal Reader</div>
        <div id="fileMeta"></div>
      </div>

      <div id="controls">
        <div class="group">
          <label>Start</label>
          <input id="startPage" type="number" min="1" value="1" />
        </div>

        <div class="group">
          <label>Goal pages</label>
          <input id="goalPages" type="number" min="1" value="10" />
        </div>

        <div class="group">
          <label>Goal minutes</label>
          <input id="goalMinutes" type="number" min="1" value="20" />
        </div>

        <div class="group">
          <label>Timer</label>
          <select id="timerMode">
            <option value="countup">Count up</option>
            <option value="countdown">Countdown</option>
          </select>
        </div>

        <button id="applyGoal">Apply</button>

        <div class="sep"></div>

        <div class="timer">
          <div id="timerDisplay">00:00:00</div>
          <button id="timerToggle">Start</button>
          <button id="timerReset">Reset</button>
        </div>
      </div>
    </div>

    <div id="progressWrap">
      <div id="progressText"></div>
      <div id="progressBarOuter">
        <div id="progressBarInner"></div>
      </div>
    </div>

    <div id="main">
      <div id="sidebar">
        <div class="stat">
          <div class="k">Current page</div>
          <div class="v" id="currentPage">–</div>
        </div>
        <div class="stat">
          <div class="k">Total pages</div>
          <div class="v" id="totalPages">–</div>
        </div>
        <div class="stat">
          <div class="k">Target end page</div>
          <div class="v" id="endPage">–</div>
        </div>
        <div class="stat">
          <div class="k">Remaining pages</div>
          <div class="v" id="remainingPages">–</div>
        </div>

        <div class="stat">
          <div class="k">Time remaining</div>
          <div class="v" id="remainingTime">–</div>
        </div>

        <div class="stat">
          <div class="k">Pace needed</div>
          <div class="v" id="paceNeeded">–</div>
        </div>

        <div class="hint">Scroll to read. Page updates automatically.</div>
      </div>

      <div id="viewer">
        <div id="canvasWrap"></div>
      </div>
    </div>

    <script type="module" src="viewer.js"></script>
  </body>
</html>
